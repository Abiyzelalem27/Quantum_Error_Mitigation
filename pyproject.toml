

[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "qem"
version = "0.1.0"
description = "Quantum Error Mitigation"
readme = "README.md"

license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = [
    "quantum computing",
    "error mitigation",
    "qiskit",
    "quantum advantage",
    "QAOA",
    "SQD",
    "samplomatic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    # Core Qiskit
    "qiskit>=1.0.0",
    "qiskit-ibm-runtime>=0.47.0",
    "qiskit-aer>=0.15.0",
    
    # Samplomatic & Directed Execution
    "samplomatic>=0.16.0",
    
    # Qiskit Add-ons
    "qiskit-addon-pna>=0.1.0",
    "qiskit-addon-slc>=0.1.0",
    "qiskit-addon-sqd>=0.11.0",
    "qiskit-addon-opt-mapper>=0.1.0",
    
    # Measurement Mitigation
    "mthree>=1.0.0",
    
    # Chemistry & Fermionic Simulation
    "ffsim>=0.0.72",
    "pyscf>=2.0.0",
    
    # General Toolkit
    "mitiq>=0.45.0",
    
    # Scientific Computing
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    
    # Visualization & Graph Processing
    "matplotlib>=3.7.0",
    "networkx>=3.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "pylatexenc>=2.0",
    
    # Performance
    "rustworkx>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
    "notebook>=6.0.0",
]

docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]


[tool.setuptools]
packages = {find = {where = ["src"]}}
package-dir = {"" = "src"}

[tool.setuptools.package-data]
qem = ["**/*.pyi", "data/*.npy"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=qem --cov-report=html --cov-report=term -v"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src/qem"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]